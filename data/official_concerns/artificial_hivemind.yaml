    raised_by: ["cdsj"]
    severity: "moderate"
    resolved_in_rebuttal: true
    rebuttal_resolution: "Authors clarified that averaging is motivated by how reward models are currently used in training (they typically see averaged scores). They also released all individual annotations to enable alternative analyses. Reviewer cdsj acknowledged: 'I admit I don't have a good solution.'"
