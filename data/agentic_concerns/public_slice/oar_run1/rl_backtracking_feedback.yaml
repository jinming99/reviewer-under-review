    text: >-
      Introduction implies KV cache rollback to a safe state, but method explicitly
      says no internal state reversion occurs — misleading mechanism description.
    severity:
      level: moderate
      addressability: addressable
      mechanism: none
    source: other
    source_detail: "Comment 1 (Type: logical)"
    decisive: false
    tags: [clarity, methodology]
    dimension_impact: [G]

  - id: A2
    text: >-
      Introduction describes plural specialized critics per safety category, but
      method implements a single general-purpose critic.
    severity:
      level: minor
      addressability: addressable
      mechanism: none
    source: other
    source_detail: "Comment 2 (Type: logical)"
    decisive: false
    tags: [clarity, consistency]
    dimension_impact: [G]

  - id: A3
    text: >-
      "Middle filling" listed as a known adversarial strategy alongside established
