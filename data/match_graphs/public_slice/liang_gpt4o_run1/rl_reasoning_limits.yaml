  - "O2"   # Random guessing explanation not ruled out (79qN)
  - "O3"   # Overfitting to test set as alternative explanation (79qN)
  - "O4"   # Table 1 should note training data (79qN minor)
  - "O5"   # Figure 6 perplexity vs o1 relevance (79qN minor)
  - "O6"   # Figure 8 readability (79qN minor)
  - "O7"   # Tables 4&5 should report fraction overlap (79qN minor)
  - "O8"   # Figure 16 temperature inconsistency (79qN minor)
  - "O9"   # Terminology 'reasoning capacity' misnomer (79qN)
  - "O13"  # Base model dependency (tKuY)
  - "O15"  # Experiments mainly Qwen series (6ryS)
  - "O18"  # Policy optimization parameters not reported (6ryS)
  - "O19"  # Perplexity analysis only two AIME samples (6ryS)
  - "O20"  # Scaling to 70B+ models (tKuY, KdU6)
  - "O21"  # Effect of task difficulty on pass@k gap (KdU6)
  - "O22"  # Train vs test pass@k not distinguished (KdU6)
  - "O23"  # Perplexity evolution during training not shown (KdU6)
  - "O24"  # Limitations section missing/insufficient (KdU6, 79qN)
  - "O25"  # Contradicting CoT-Pass@k paper (KdU6)
  - "O26"  # SFT pre-training effect on conclusions (79qN)

unmatched_agentic: []
# All 5 agentic concerns have at least one exact or partial match edge.
# The agentic review's concerns are generic enough that each maps to some official concern,
# but the reverse is not true -- the review misses 20 of 26 specific official concerns.
