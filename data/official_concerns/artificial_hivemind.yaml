    note: "Minor suggestion from a low-confidence reviewer. The related work section was expanded."

  # ============================================================
  # O9: Open-endedness of queries not verified
  # Raised by: cdsj (main concern 1)
  # ============================================================
  - id: "O9"
    text: "The extent of the 'open-endedness' of collected queries was not verified; the dataset construction relies on automated filtering but lacks human validation that queries genuinely admit multiple plausible responses."
    verbatim: "The extent of the 'open-endedness' of collected queries was not verified"
    raised_by: ["cdsj"]
    severity: "major"
    resolved_in_rebuttal: true
    rebuttal_resolution: "Authors conducted a new human study with 86 Prolific annotators on 100 queries. By majority vote, 89% of queries were judged open-ended; with at least one annotator agreeing, 100% qualified. 81.27% of queries allow 3+ alternatives, 34.66% allow 20+. Results committed to be included in camera-ready."
    ac_treatment: "resolved"
    decisive: false
    tags: ["dataset_validation", "open-endedness_verification", "human_study"]
    issue_type: "empirical"
    addressed_in_pdf: true
    pdf_evidence: "Appendix B.3 'Human Validation of the Open-endedness of Queries in INFINITY-CHAT' (pp.21-22) presents the full study: 100 examples, 86 Prolific annotators, 3 per query, two questions (Q1: is it open-ended? Q2: how many alternatives?). Reports 89% open-ended by majority vote, 100% by any-one-agrees criterion. Table 1 (p.22) shows degree distribution: 18.73% fewer than 3, 31.87% 3-10, 14.74% 10-20, 34.66% more than 20."
    note: "This was cdsj's first and most important concern. The new human study was decisive in resolving it. Reviewer cdsj stated: 'The first of my 3 main concerns is addressed.'"

  # ============================================================
  # O10: Similarity scores lack reference/baseline for interpretation
  # Raised by: cdsj (main concern 2)
  # ============================================================
  - id: "O10"
    text: "The cosine similarity scores used to demonstrate homogeneity lack a reference baseline or contextualization; without knowing what random or expected similarity looks like, the reported scores (0.7-0.8 range) cannot be meaningfully interpreted."
    verbatim: "similarity scores...used to show the existence of the homogeneity phenomenon lack reference and thus cannot be interpreted meaningfully"
    raised_by: ["cdsj"]
    severity: "major"
    resolved_in_rebuttal: true
    rebuttal_resolution: "Authors computed a random similarity baseline: randomly paired responses fall in the 0.1-0.2 range, while model responses cluster at 0.7-0.9, showing a clear and substantial gap. Also provided clustering analysis showing top-50 closest responses come from ~8 distinct models on average. Committed to including in camera-ready."
    ac_treatment: "resolved"
    decisive: false
    tags: ["baseline_comparison", "metric_interpretation", "contextualization"]
    issue_type: "empirical"
    addressed_in_pdf: true
    pdf_evidence: "The random baseline is referenced in the rebuttal discussion. Appendix C.1 (p.29) describes that 'All similarities are computed using cosine similarity between sentence embeddings' and provides concrete examples in Tables 12-16 (pp.38-42) with similarity score pairs showing the full range. Figure 8 (p.6) shows the unique source model analysis. The camera-ready incorporates the baseline comparison data in Figures 4-5 (p.4) where the row labeled '0.0-0.1' shows 0% for all models (i.e., no responses fall in the random baseline range)."
    note: "cdsj's second key concern. The random baseline (0.1-0.2 for random pairs vs 0.7-0.9 for model responses) was a convincing contextualization. Reviewer cdsj also asked for the baseline to be included with Figure 6 specifically."

  # ============================================================
  # O11: Section 4 analysis on human disagreement is technically flawed
  # Raised by: cdsj (main concern 3)
  # ============================================================
  - id: "O11"
    text: "The analysis correlating model ratings with human ratings in Section 4 is technically flawed: the methodology for selecting 'similar-quality' responses and 'high annotator disagreement' subsets is questionable, the use of entropy as a disagreement measure is unjustified, and the motivation for averaging human ratings is unclear."
    verbatim: "analysis on correlations with human disagreement is technically flawed and is not well motivated"
    raised_by: ["cdsj"]
    severity: "major"
    resolved_in_rebuttal: true
    rebuttal_resolution: "Authors provided extensive additional analysis: (1) tested multiple alternative subset selection methods (Tukey, centroid-based, distance-based, sliding window, median expansion, gap-based) showing consistent trends; (2) added alternative disagreement metrics (Fleiss' kappa, majority vs minority, Gini impurity, pairwise disagreement) confirming the same pattern; (3) clarified motivation for averaging human ratings in terms of model training practice. Committed to using Fleiss' kappa as primary metric and including all alternative methods in appendix."
    ac_treatment: "resolved"
    decisive: false
    tags: ["methodology", "statistical_analysis", "subset_selection", "disagreement_metrics"]
    issue_type: "empirical"
    addressed_in_pdf: true
    pdf_evidence: "Appendix D.3 (pp.50-51) includes Table 19 with alternative similar-quality subset selection methods and their Spearman correlations. Appendix D.4 (p.52) includes Table 20 with alternative disagreement metrics. Section 4.3 (pp.8-9) presents the main analysis. The camera-ready retains Tukey's fences as the primary method but acknowledges alternatives. Figures 10-11 (pp.8-9) show correlation trends for both absolute and pairwise ratings across subsets."
    note: "cdsj's most detailed technical concern, spanning multiple sub-points. The reviewer engaged in extensive discussion, requesting alternative methods and metrics. After receiving comprehensive additional analyses, cdsj stated: 'The new results and analysis have addressed the remaining concerns, and I am now satisfied this paper should be accepted.'"

  # ============================================================
  # O12: Similarity score range too narrow for meaningful comparison
  # Raised by: cdsj (follow-up on O10)
  # ============================================================
  - id: "O12"
    text: "In Figure 6, most average similarity scores are tightly clustered in the 0.7-0.8 range with little difference among them, making it hard to meaningfully compare the numbers; full distributions rather than just averages should be shown."
    verbatim: "most average similarity scores are tightly clustered in the range of 0.7-0.8 with little difference among them"
    raised_by: ["cdsj"]
    severity: "moderate"
    resolved_in_rebuttal: true
    rebuttal_resolution: "Authors pointed to Tables 6-10 in the appendix providing finer-grained repetition scores by similarity range, and added the random baseline for comparison context."
    ac_treatment: "not_mentioned"
    decisive: false
    tags: ["visualization", "granularity", "distribution_analysis"]
    issue_type: "empirical"
    addressed_in_pdf: true
    pdf_evidence: "Tables 7-11 (pp.33-37) provide the full inter-model repetition results broken down by similarity range bins (0.9-1.0, 0.8-0.9, etc.) for all model pairs. This is substantially more granular than the heatmap averages in Figure 6 (p.5). Table 6 (p.32) provides the same for intra-model repetition."
    note: "Follow-up concern from cdsj about the granularity of Figure 6. The appendix tables addressed this by providing full distributions."

  # ============================================================
  # O13: Cosine metric vs inter/intra model metric inconsistency
  # Raised by: cdsj (follow-up)
  # ============================================================
  - id: "O13"
    text: "If the goal is to compare inter- and intra-model similarity, why not use the cosine similarity as done in Figure 4 and 6/7 directly, instead of the different metric used for inter vs intra comparison?"
    verbatim: "if the goal is to compare inter- and intra-model similarity, why not use the cosine similarity"
    raised_by: ["cdsj"]
    severity: "minor"
    resolved_in_rebuttal: false
    rebuttal_resolution: "Not directly addressed in rebuttal; the paper uses cosine similarity throughout but presents it in different visualizations (heatmaps for pairwise, distributions for within-model)."
    ac_treatment: "not_mentioned"
    decisive: false
    tags: ["metric_consistency", "visualization_methodology"]
    issue_type: "empirical"
    addressed_in_pdf: false
    pdf_evidence: "Figures 4-5 (p.4) show intra-model similarity distributions, Figure 6 (p.5) shows inter-model pairwise averages. Both use the same underlying cosine similarity metric on sentence embeddings. The visualization formats differ but the metric is consistent."
    note: "Minor methodological question about presentation consistency. The underlying metric (cosine similarity of text-embedding-3-small embeddings) is the same throughout."

