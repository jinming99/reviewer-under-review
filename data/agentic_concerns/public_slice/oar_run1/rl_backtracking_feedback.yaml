schema_version: "v1"
paper: rl_backtracking_feedback
version: baseline
method: baseline
verdict: REJECT
score: null

decision_drivers:
  - id: R1
    polarity: pro_reject
    text: >-
      Novelty over BSAFE is incremental — the key differences reduce to a simplified
      token-retraction format and an added RL stage — without a sharp ablation or
      conceptual argument for why these modifications constitute a substantial advance.
    evidence: "Overall Feedback: 'the novelty over BSAFE appears incremental — the key differences reduce to a simplified token-retraction format and an added RL stage'"
    linked_concern_ids: [A21, A8]
  - id: R2
    polarity: pro_reject
    text: >-
      Paper conflates adversarial jailbreaking and in-distribution safety errors
      under a single threat model, with the largely unexamined assumption that a
      critic can reliably detect violations in real time against adaptive adversaries.
    evidence: "Overall Feedback: 'conflates two distinct threat models...the backtracking mechanism is fundamentally reactive and post-hoc...a strong and largely unexamined assumption'"
    linked_concern_ids: [A22]
  - id: R3
    polarity: pro_reject
    text: >-
      Claimed resilience against GCG attacks is unsubstantiated — no rigorous
      adversarial evaluation with adaptive attacks targeting the critic or the
      backtracking mechanism itself.
    evidence: "Overall Feedback: 'requires rigorous adversarial evaluation (e.g., adaptive attacks that target the critic or the backtracking mechanism itself)'"
    linked_concern_ids: [A24]
  - id: R4
    polarity: pro_reject
    text: >-
      Core SFT formalization excludes the violation from the conditioning context,
      making the BACKTRACK_BY_X signal nonsensical during training — the model
      never sees the violation it is supposed to learn to retract.
    evidence: "Comment 5: 'the SFT input is explicitly defined as p′ = p ⊕ rsafe,part1, which excludes the injected violation v'"
    linked_concern_ids: [A5]

mentions:
  - id: M1
    polarity: pro_accept
    text: >-
      Core idea of training models via RL to emit a lightweight "backtrack by x tokens"
      correction signal is intuitive and practically appealing.
    evidence: "Overall Feedback: 'the core idea...is intuitive and practically appealing'"
    note: "Acknowledged as a strength but not enough to outweigh identified issues"
  - id: M2
    polarity: pro_accept
    text: >-
      Paper presents a clear and well-motivated extension of prior backtracking-based
      safety work (BSAFE).
    evidence: "Overall Feedback: 'a clear and well-motivated extension of prior backtracking-based safety work (BSAFE)'"
    note: "Recognized as positive framing but novelty questioned as incremental"

concerns:
