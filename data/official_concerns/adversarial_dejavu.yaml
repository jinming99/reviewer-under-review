revision_evidence: "OpenReview shows '2 Versions' badge (Published: 26 Jan 2026, Last Modified: 01 Mar 2026). Authors' Discussion-Period Summary explicitly states 'No core changes were made to the method or claims, and the main contributions remain intact' but lists substantive additions: Mistral-7B model (Table 2), BEAST and SAA attacks (Table 2), Figure 4 skill composition example, Claude 3.7 Sonnet as second judge (Table 1), control experiments (random skill, refusal training, DeepSeek helper, 20 refusal templates), three-seed stability results, StrongReject clarification, and revised Introduction citing AutoDAN-Turbo/WildTeaming. PDF contains Figure 4 (new), Table 2 with Mistral rows and BEAST/SAA columns, Table 1 with Claude scores, and references to Claude Sonnet 4 (October 2025) confirming post-submission content."

