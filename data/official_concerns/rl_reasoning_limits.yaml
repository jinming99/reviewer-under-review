  # O25: Contradicting paper with different metric (CoT-Pass@k)
  # Raised by: KdU6 (post-rebuttal comment)
  # ============================================================
  - id: "O25"
    text: "A concurrent paper using CoT-Pass@k metric draws opposite conclusions about whether RLVR incentivizes correct reasoning in base LLMs. This raises questions about metric sensitivity."
    verbatim: "this new paper...draws an opposite conclusion as yours by using a more fine-grained evaluation metric called CoT-Pass@k"
    raised_by: ["KdU6"]
