<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" fill="none" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="routeGradient" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2b7c8a"/>
      <stop offset="1" stop-color="#8a3fb8"/>
    </linearGradient>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- ============================================================ -->
    <!-- Stage 1: Paper                                                -->
    <!-- ============================================================ -->
    <g transform="translate(40, 95)">
      <rect x="14" y="14" width="56" height="72" rx="4" fill="#ffffff" stroke="#666666" stroke-width="2"/>
      <rect x="8"  y="8"  width="56" height="72" rx="4" fill="#ffffff" stroke="#666666" stroke-width="2"/>
      <rect x="2"  y="2"  width="56" height="72" rx="4" fill="#ffffff" stroke="#c89a48" stroke-width="2.5"/>
      <line x1="10" y1="16" x2="50" y2="16" stroke="#666666" stroke-width="2"/>
      <line x1="10" y1="24" x2="50" y2="24" stroke="#666666" stroke-width="2"/>
      <line x1="10" y1="32" x2="50" y2="32" stroke="#666666" stroke-width="2"/>
      <line x1="10" y1="40" x2="42" y2="40" stroke="#666666" stroke-width="2"/>
      <line x1="10" y1="52" x2="50" y2="52" stroke="#666666" stroke-width="2"/>
      <line x1="10" y1="60" x2="50" y2="60" stroke="#666666" stroke-width="2"/>
      <line x1="10" y1="68" x2="38" y2="68" stroke="#666666" stroke-width="2"/>
    </g>
    <text x="70" y="215" text-anchor="middle" font-size="12" fill="#1a1a2e" font-weight="600">Paper</text>

    <!-- Flow line paper -> reviewers split -->
    <path d="M110 130 C 135 130, 145 70, 175 70" stroke="#c89a48" stroke-width="2" stroke-opacity="0.85" fill="none"/>
    <path d="M110 130 C 135 130, 145 190, 175 190" stroke="#c89a48" stroke-width="2" stroke-opacity="0.85" fill="none"/>

    <!-- ============================================================ -->
    <!-- Stage 2: Split reviewers                                      -->
    <!-- ============================================================ -->

    <!-- Upper branch: Official (human) -->
    <g transform="translate(180, 42)">
      <circle cx="16" cy="12" r="7" stroke="#2b7c8a" stroke-width="2.5" fill="#ffffff"/>
      <path d="M4 36 C 4 25, 28 25, 28 36 L 28 40 L 4 40 Z" stroke="#2b7c8a" stroke-width="2.5" fill="#ffffff"/>
      <rect x="44" y="4" width="74" height="50" rx="6" stroke="#2b7c8a" stroke-width="1.5" stroke-opacity="0.55" fill="#ffffff"/>
      <circle cx="56"  cy="16" r="3.5" fill="#2b7c8a"/>
      <circle cx="72"  cy="16" r="3.5" fill="#2b7c8a"/>
      <circle cx="88"  cy="16" r="3.5" fill="#2b7c8a"/>
      <circle cx="104" cy="16" r="3.5" fill="#2b7c8a"/>
      <circle cx="56"  cy="30" r="3.5" fill="#2b7c8a"/>
      <circle cx="72"  cy="30" r="3.5" fill="#2b7c8a"/>
      <circle cx="88"  cy="30" r="3.5" fill="#2b7c8a"/>
      <circle cx="104" cy="30" r="3.5" fill="#2b7c8a"/>
      <circle cx="56"  cy="44" r="3.5" fill="#2b7c8a"/>
      <circle cx="72"  cy="44" r="3.5" fill="#2b7c8a"/>
    </g>
    <text x="238" y="112" text-anchor="middle" font-size="11" fill="#666666">Official review</text>

    <!-- Lower branch: AI (robot) -->
    <g transform="translate(180, 160)">
      <rect x="4" y="8" width="24" height="22" rx="4" stroke="#8a3fb8" stroke-width="2.5" fill="#ffffff"/>
      <circle cx="12" cy="18" r="2" fill="#8a3fb8"/>
      <circle cx="20" cy="18" r="2" fill="#8a3fb8"/>
      <line x1="16" y1="2" x2="16" y2="8" stroke="#8a3fb8" stroke-width="2.5"/>
      <circle cx="16" cy="2" r="1.5" fill="#8a3fb8"/>
      <line x1="10" y1="24" x2="22" y2="24" stroke="#8a3fb8" stroke-width="1.5" stroke-opacity="0.6"/>
      <rect x="44" y="-4" width="74" height="50" rx="6" stroke="#8a3fb8" stroke-width="1.5" stroke-opacity="0.55" fill="#ffffff"/>
      <circle cx="56"  cy="8"  r="3.5" fill="#8a3fb8"/>
      <circle cx="72"  cy="8"  r="3.5" fill="#8a3fb8"/>
      <circle cx="88"  cy="8"  r="3.5" fill="#8a3fb8"/>
      <circle cx="104" cy="8"  r="3.5" fill="#8a3fb8"/>
      <circle cx="56"  cy="22" r="3.5" fill="#8a3fb8"/>
      <circle cx="72"  cy="22" r="3.5" fill="#8a3fb8"/>
      <circle cx="88"  cy="22" r="3.5" fill="#8a3fb8"/>
      <circle cx="104" cy="22" r="3.5" fill="#8a3fb8"/>
      <circle cx="56"  cy="36" r="3.5" fill="#8a3fb8"/>
      <circle cx="72"  cy="36" r="3.5" fill="#8a3fb8"/>
      <circle cx="88"  cy="36" r="3.5" fill="#8a3fb8"/>
    </g>
    <text x="238" y="222" text-anchor="middle" font-size="11" fill="#666666">AI review</text>

    <!-- Flow concerns -> match graph -->
    <path d="M300 70 C 330 70, 345 95, 380 95" stroke="#c89a48" stroke-width="2" stroke-opacity="0.75" fill="none"/>
    <path d="M300 185 C 330 185, 345 165, 380 165" stroke="#c89a48" stroke-width="2" stroke-opacity="0.75" fill="none"/>

    <!-- ============================================================ -->
    <!-- Stage 3: Bipartite match graph (centerpiece)                  -->
    <!-- ============================================================ -->
    <g transform="translate(400, 30)">
      <rect x="-8" y="0" width="296" height="200" rx="14" fill="#faf7f0" stroke="#c89a48" stroke-width="1" stroke-opacity="0.55"/>

      <!-- edges -->
      <path d="M26 30 C 100 30, 180 30, 254 30" stroke="#4d8b3f" stroke-width="3"/>
      <path d="M26 62 C 100 62, 180 62, 254 62" stroke="#c89a48" stroke-width="3"/>
      <path d="M26 62 C 110 62, 170 94, 254 94" stroke="#888888" stroke-width="2" stroke-opacity="0.8"/>
      <path d="M26 94 C 110 94, 170 62, 254 62" stroke="#888888" stroke-width="2" stroke-opacity="0.8"/>
      <path d="M26 94 C 110 94, 180 126, 254 126" stroke="#4d8b3f" stroke-width="3"/>
      <path d="M26 126 C 100 126, 180 158, 254 158" stroke="#c89a48" stroke-width="3"/>

      <!-- left (teal) nodes — official concerns -->
      <circle cx="20" cy="30"  r="6" stroke="#2b7c8a" stroke-width="3" fill="#ffffff"/>
      <circle cx="20" cy="62"  r="6" stroke="#2b7c8a" stroke-width="3" fill="#ffffff"/>
      <circle cx="20" cy="94"  r="6" stroke="#2b7c8a" stroke-width="3" fill="#ffffff"/>
      <circle cx="20" cy="126" r="6" stroke="#2b7c8a" stroke-width="3" fill="#ffffff"/>
      <circle cx="20" cy="158" r="6" stroke="#c14a54" stroke-width="3" fill="#ffffff" stroke-dasharray="2 2"/>

      <!-- right (purple) nodes — AI concerns -->
      <circle cx="260" cy="30"  r="6" stroke="#8a3fb8" stroke-width="3" fill="#ffffff"/>
      <circle cx="260" cy="62"  r="6" stroke="#8a3fb8" stroke-width="3" fill="#ffffff"/>
      <circle cx="260" cy="94"  r="6" stroke="#8a3fb8" stroke-width="3" fill="#ffffff"/>
      <circle cx="260" cy="126" r="6" stroke="#8a3fb8" stroke-width="3" fill="#ffffff"/>
      <circle cx="260" cy="158" r="6" stroke="#8a3fb8" stroke-width="3" fill="#ffffff"/>
      <circle cx="260" cy="190" r="6" stroke="#c14a54" stroke-width="3" fill="#ffffff" stroke-dasharray="2 2"/>
    </g>

    <text x="544" y="248" text-anchor="middle" font-size="12" fill="#1a1a2e" font-weight="600">Match graph</text>

    <!-- legend -->
    <g transform="translate(410, 215)" font-size="10" fill="#666666">
      <line x1="0"  y1="4" x2="14" y2="4" stroke="#4d8b3f" stroke-width="2.5"/>
      <text x="18" y="7">exact</text>
      <line x1="56" y1="4" x2="70" y2="4" stroke="#c89a48" stroke-width="2.5"/>
      <text x="74" y="7">partial</text>
      <line x1="114" y1="4" x2="128" y2="4" stroke="#888888" stroke-width="2"/>
      <text x="132" y="7">related</text>
      <circle cx="178" cy="4" r="3" stroke="#c14a54" stroke-width="1.8" fill="none" stroke-dasharray="1.6 1.6"/>
      <text x="186" y="7">unmatched</text>
    </g>

    <!-- Flow match -> ladder -->
    <path d="M700 130 C 725 130, 735 130, 760 130" stroke="#c89a48" stroke-width="2" stroke-opacity="0.85" fill="none"/>
    <path d="M755 125 L 762 130 L 755 135" stroke="#c89a48" stroke-width="2" fill="none"/>

    <!-- ============================================================ -->
    <!-- Stage 4: Evaluation ladder                                    -->
    <!-- ============================================================ -->
    <g transform="translate(770, 60)">
      <rect x="0" y="0"   width="110" height="14" rx="3" fill="#2b7c8a"/>
      <text x="118" y="11" font-size="10" fill="#666666">L0</text>

      <rect x="0" y="22"  width="94"  height="14" rx="3" fill="#4a6f98"/>
      <text x="118" y="33" font-size="10" fill="#666666">L1</text>

      <rect x="0" y="44"  width="78"  height="14" rx="3" fill="#6a5aa1"/>
      <text x="118" y="55" font-size="10" fill="#666666">L2</text>

      <rect x="0" y="66"  width="62"  height="14" rx="3" fill="#7948ac"/>
      <text x="118" y="77" font-size="10" fill="#666666">L3</text>

      <rect x="0" y="88"  width="46"  height="14" rx="3" fill="#8a3fb8"/>
      <text x="118" y="99" font-size="10" fill="#666666">L4</text>
    </g>
    <text x="820" y="215" text-anchor="middle" font-size="12" fill="#1a1a2e" font-weight="600">Evaluation ladder</text>

  </g>
</svg>
