      addressability: "addressable"
      mechanism: "none"
    source: "review_minor"
    source_detail: "Comment 6"
    decisive: false
    tags: ["notation", "presentation"]
    dimension_impact: []

  - id: "A7"
    text: "Humanoid low-similarity setting states the same goal direction range [-pi/4, pi/4] as the high-similarity setting, likely a copy-paste error."
    severity:
