    issue_type: "conceptual"
    addressed_in_pdf: false
    pdf_evidence: "Section 2.3 (p.3) argues conceptually that 'clustering treats skills as discrete and mutually exclusive while adversarial techniques frequently blend and overlap. Dictionary learning (DL) provides a more natural, structured solution: by representing skills as sparse combinations of shared primitives.' However, no empirical comparison of DL vs. clustering/deduplication baselines is provided in the paper. Section 5 (p.5) describes post-hoc redundancy filtering using cosine-similarity clustering as a complementary step, but does not compare DL-based compression against clustering-only compression."
    note: "AC's main substantive concern, raised in the meta-review summary. AC finds the methodology interesting and is 'personally very partial to the idea of using DL' but explicitly flags this gap: 'I think the paper should better show the advantages of using DL over other methods.' AC also notes: 'it is clear that methodologically showing how to combine DL and language/LLMs is interesting and has applications beyond jailbreaks.' Despite this, AC recommends acceptance, treating it as a non-blocking limitation."

  # ============================================================
  # O20: Training dataset composition not justified
  # Raised by: 5oss (via AC outstanding concerns)
  # ============================================================
  - id: "O20"
    text: "The composition of the training set (mix of vanilla harmful, HEx-PHI, AdvBench, HarmBench, adversarially composed, benign, over-refusal queries) is not justified with small-scale experiments showing each component's contribution."
    verbatim: "the authors do not address is the composition of their chosen training set...justifying the need for each of the components"
    raised_by: ["5oss"]
    severity: "moderate"
    resolved_in_rebuttal: false
    rebuttal_resolution: null
    ac_treatment: "accepted_limitation"
    decisive: false
    tags: ["training_data", "ablation", "dataset_composition"]
    issue_type: "empirical"
    addressed_in_pdf: false
    pdf_evidence: "Appendix C (p.17) lists the training dataset components (2,200 vanilla harmful + adversarially composed at k=1-5 + 25,643 benign + 1,875 over-refusal) but no ablation study isolates the marginal contribution of each component. Section 4.2 (p.9) ablates skill coverage and Section 4.3 (p.10) ablates composition depth, but neither ablates the non-adversarial components of the training mix."
    note: "AC cites this under 'Reviewer 5oss (Weakness 2)' in the outstanding concerns section. 5oss wanted 'small-scale experiments justifying the need for each of the components of the dataset.' This was not addressed in rebuttal or the revised paper."

  # ============================================================
  # O21: ASR vs ALO reporting suggestion
  # Raised by: AC_1jTh
  # ============================================================
  - id: "O21"
    text: "The paper reports average ASR across attacks in Table 2, but ALO (Attack Loss Optimization or similar metric from MixAT) is also informative and could be reported alongside."
    verbatim: "Introduces ALO (at least one) ASR measurement as a better way to combine the ASR of different attack strategies"
    raised_by: ["AC_1jTh"]
    severity: "minor"
    resolved_in_rebuttal: null
    ac_treatment: "not_mentioned"
    decisive: false
    tags: ["evaluation_metric", "reporting", "asr_variants"]
    issue_type: "empirical"
    addressed_in_pdf: false
    pdf_evidence: "Table 2 (p.8) reports 'Mean Harmful Scores (0-1)' as a single aggregate. No ALO (at-least-one) metric is reported. The AC's suggestion to adopt this metric from MixAT was not incorporated."
    note: "AC suggestion from the meta-review. Non-blocking enhancement request."

  # ============================================================
  # O22: Is dictionary learning truly needed?
  # Raised by: AC_1jTh
  # ============================================================
  - id: "O22"
    text: "The AC questions whether dictionary learning is truly needed, noting that clustering with embedding distances could achieve similar compression and the technical complexity of DL recovery needs stronger justification."
    verbatim: "finding the size of the dataset reduced through clustering/embedding distances that match the DL approach"
    raised_by: ["AC_1jTh"]
    severity: "moderate"
    resolved_in_rebuttal: null
    ac_treatment: "accepted_limitation"
    decisive: false
    tags: ["method_justification", "dictionary_learning", "necessity"]
    issue_type: "conceptual"
    addressed_in_pdf: false
    pdf_evidence: "Section 2.3 (p.3) provides a conceptual argument for DL over clustering but no empirical ablation comparing DL-compressed dictionary against a clustering-compressed one of equal size. The post-hoc redundancy filtering step (Section 2.3, p.5) itself uses cosine-similarity clustering, suggesting clustering plays a complementary role but is not compared as a standalone alternative."
    note: "This is closely related to O19 but more specific -- AC suggests a concrete experiment (find clustering-based compression that matches DL dataset size and compare). Grouped with O19 thematically but kept separate because AC raises it as a distinct actionable suggestion. AC explicitly accepts this as non-blocking: 'the paper's merits outweigh by a lot the missing opportunities.'"

ac_decision_drivers:
  - id: "D1"
    polarity: "pro_accept"
    text: "The Adversarial Deja Vu hypothesis is a novel and important observation with wide implications for the jailbreaking community. AC states: 'the DejaVu observation in itself is an important contribution of the paper that I believe will have wide implications throughout the community.'"
    decisive: true
    observable_stage: "pre_rebuttal"
    tags: ["novelty", "hypothesis", "community_impact"]

  - id: "D2"
    polarity: "pro_accept"
    text: "The paper provides a principled DL-based pipeline for decomposing attacks into reusable skill primitives, with LLM-augmented basis pursuit for explainability praised as 'smart' and 'novel.' AC is 'personally very partial to the idea of using DL for this task and find it principally justified.'"
    decisive: true
    observable_stage: "pre_rebuttal"
    tags: ["methodology", "dictionary_learning", "explainability"]

  - id: "D3"
    polarity: "pro_accept"
    text: "Reviewer Q4KG reversed from 2 to 6 post-rebuttal, explicitly stating concerns were fully resolved and the contribution is not incremental. AC predicted this reversal."
    decisive: true
    observable_stage: "rebuttal"
    tags: ["reviewer_reversal", "rebuttal_effectiveness"]

  - id: "D4"
    polarity: "pro_accept"
    text: "Three reviewers provided positive pre-rebuttal evaluations (6, 6, 8) and the fourth reversed to 6 post-rebuttal, creating consensus support. AC states scores for jXni and 5oss would have been raised to 8."
    decisive: true
    observable_stage: "post_discussion"
    tags: ["reviewer_consensus", "score_trajectory"]

  - id: "D5"
    polarity: "pro_accept"
    text: "ASCoT substantially improves robustness to unseen attacks including multi-turn jailbreaks while maintaining low over-refusal rates, validated with key control experiments added per reviewer suggestion."
    decisive: true
    observable_stage: "rebuttal"
    tags: ["empirical_validation", "robustness", "control_experiments"]

  - id: "D6"
    polarity: "pro_accept"
    text: "The paper's merits outweigh missing opportunities: AC states 'the paper's merits outweigh by a lot the missing opportunities to convince the reader of the effectiveness of the methodology.'"
    decisive: true
    observable_stage: "post_discussion"
    tags: ["overall_merit", "ac_judgment"]

  - id: "D7"
    polarity: "pro_accept"
    text: "The novelty measurement aspect is independently valuable: AC notes 'it will be a nice measurement of the novelty of new jailbreak attacks, as I think it is widely recognized in the current field that many jailbreak methods (especially the very narrow ones) have become hard to keep track of.'"
    decisive: false
    observable_stage: "pre_rebuttal"
    tags: ["practical_utility", "novelty_measurement"]

  - id: "D8"
    polarity: "pro_reject"
    text: "Paper should better show advantages of dictionary learning over simpler alternatives like clustering or deduplication."
    decisive: false
    observable_stage: "pre_rebuttal"
    tags: ["method_justification", "dictionary_learning"]

  - id: "D9"
    polarity: "pro_reject"
    text: "Paper format violated ICLR submission template width restriction, which AC flags as 'potentially a very serious breach of the rules.' AC: 'You can legitimately be desk rejected for this.'"
    decisive: false
    observable_stage: "pre_rebuttal"
    tags: ["formatting", "rules_compliance"]

