- slug: ifdecorator
  filename: 18895_IFDECORATOR_Wrapping_Ins.pdf
  title: 'IFDecorator: Instruction Following with Better Instruction Decorating'
  venue: ICLR 2026
  decision: rejected
  pdf_version: submission
  our_verdict: ACCEPT
  our_score: 75.0
  calibration_set: 2
  notes: 'FALSE POSITIVE. AC consensus: ''engineering synthesis rather than a significant break from the state-of-the-art.''
    Each component (cooperative data generation ≈ AutoIF, intent verification ≈ constraint checking, Trip Wires ≈ probe tasks)
    has close named precedent. Despite strong rebuttal adding ComplexBench, MultiIF, cross-family validation — novelty remained
    the deciding factor. Reviewer WDg6 scored 2.'
- slug: teaching_llms_plan
  filename: 20208_Teaching_LLMs_to_Plan_Lo.pdf
  title: 'Teaching LLMs to Plan: A Teacher-Student Framework with Selective Reinforcement'
  venue: ICLR 2026
  decision: rejected
  pdf_version: submission
  our_verdict: REJECT
  our_score: null
  calibration_set: 2
  notes: 'TRUE REJECT. Correctly caught by G2 (baseline fairness). No external baselines — only compared against own teacher.
    AC meta-review: ''the main weakness of this paper... no other strong planning methods are compared.'' Also: PDDL-only
    evaluation, limited domain generalization.'
