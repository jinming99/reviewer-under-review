  - O5   # Figure 6 relevance of perplexity vs o1 unclear
  - O6   # Figure 8 readability issues
  - O7   # Tables 4 & 5 should report fraction overlap
  - O8   # Figure 16 AIME24 temperature inconsistency
  - O9   # Terminology misnomer (related-only match with A4)
  - O10  # Limited theoretical insight for why RLVR fails
  - O11  # May not generalize to future RL paradigms
  - O12  # Missing improvement suggestions
  - O13  # Base model dependency
  - O14  # No theoretical explanation
  - O15  # Qwen model series dominance
  - O16  # Evaluation too centered on pass@k
  - O17  # Similar insights in DeepSeekMath
  - O18  # Missing policy optimization parameters
  - O20  # Scaling to larger models (70B+)
  - O21  # Effect of task difficulty on pass@k gap
  - O22  # Train vs test pass@k not distinguished
  - O23  # Perplexity evolution during training not shown
  - O24  # Limitations section insufficient
  - O25  # Contradicting concurrent paper with CoT-Pass@k
  - O26  # SFT pre-training effect on conclusions

unmatched_agentic:
