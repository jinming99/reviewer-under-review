    raised_by: ["jXni"]
    severity: "major"
    resolved_in_rebuttal: true
    rebuttal_resolution: "Authors added Mistral-7B-Instruct-v0.2 as a third model family. ASCoT outperforms baselines across all attack suites on all three models."
    ac_treatment: "not_mentioned"
    decisive: false
    tags: ["model_coverage", "generalizability", "evaluation_scope"]
    issue_type: "empirical"
    addressed_in_pdf: true
    pdf_evidence: "Table 2 (p.8) now includes a full 'Mistral' section with rows for Refusal Trained, PAP Trained, CAT, CAT*, LAT, LAT*, WildJailbreak, ASCoT (closed), and ASCoT (open) across all seen and unseen attacks. Three model families are now evaluated."
    note: "jXni suggested Qwen2.5/3, Gemma-2/3, Llama-2, Vicuna, and Mistral. Authors added Mistral only. AC does not explicitly address this concern but states 'If I were the reviewer, I would have raised the score to an 8' for jXni."

