  - O4   # Table 1 training data annotation
  - O5   # Figure 6 perplexity vs o1 relevance
  - O6   # Figure 8 readability
  - O7   # Tables 4-5 percentage overlap format
  - O8   # Temperature inconsistency (related-only to A6)
  - O9   # Terminology misnomer
  - O10  # Theoretical explanation gap (related-only to A8)
  - O11  # Narrow scope / future RL paradigms
  - O13  # Base model dependency
  - O14  # No theoretical explanation (overlaps O10)
  - O15  # Qwen model series dominance
  - O17  # Novelty concern / DeepSeekMath prior work
  - O19  # Perplexity analysis limited samples (related-only to A4)
  - O20  # Scaling to 70B+ models
  - O21  # Task difficulty effect on pass@k gap
  - O22  # Train vs test pass@k curves
  - O23  # Perplexity evolution during training
  - O24  # Limitations section insufficient
  - O25  # Contradicting CoT-Pass@k paper
  - O26  # SFT pre-training effect

