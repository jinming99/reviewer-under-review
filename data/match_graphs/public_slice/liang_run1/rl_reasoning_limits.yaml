  - "O11"   # May not generalize to future RL paradigms/reward structures (tKuY)
  - "O12"   # Limited improvement suggestions (tKuY)
  - "O13"   # Base model dependency (tKuY)
  - "O15"   # Experiments focus on Qwen model series (6ryS)
  - "O16"   # Evaluation too centered on pass@k (6ryS)
  - "O21"   # Effect of task difficulty on pass@k gap (KdU6)
  - "O22"   # Train vs test pass@k curves not distinguished (KdU6)
  - "O23"   # Perplexity evolution during training not shown (KdU6)
  - "O24"   # Limitations section missing/insufficient (KdU6, 79qN)
  - "O25"   # Contradicting CoT-Pass@k paper (KdU6)
  - "O26"   # SFT pre-training effect on conclusions (79qN)
  # Minor concerns unmatched
  - "O4"    # Table 1 training data layout (79qN)
  - "O5"    # Figure 6 perplexity vs o1 clarity (79qN)
  - "O6"    # Figure 8 readability (79qN)
  - "O7"    # Tables 4&5 percentage overlap (79qN)
  - "O8"    # Figure 16 temperature inconsistency (79qN) — related-only to A5
