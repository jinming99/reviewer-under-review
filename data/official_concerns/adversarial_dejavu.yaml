    severity: "moderate"
    resolved_in_rebuttal: true
    rebuttal_resolution: "Authors clarified StrongReject is a rubric-based harmfulness metric from Souly et al. (NeurIPS 2024) using GPT-4.1-mini as judge on the official forbidden-prompt dataset. Paper updated to include explicit description."
    ac_treatment: "not_mentioned"
    decisive: false
    tags: ["evaluation_detail", "metric_definition", "clarity"]
