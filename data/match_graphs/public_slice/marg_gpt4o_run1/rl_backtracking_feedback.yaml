schema_version: "v1"
paper: "rl_backtracking_feedback"
version: "v0.9.2"
condition: "own_group/marg_gpt4o_run1"
method: "baseline_marg"

matches:
  # ============================================================
  # STRICT MATCHES (exact / partial)
  # ============================================================

  - official_id: O1
    agentic_id: A11
    match_type: partial
    issue: "Insufficient experimental detail (hyperparameters, benchmark definitions, data splits) for reproducibility"
    judgment_alignment: aligned
    severity_alignment: match  # official: major, agentic: moderate (gap = -1, within tolerance)
    rationale: >
      O1 flags key implementation details (data splits, hyperparameters, compute budget) deferred to
      supplementary. A11 flags missing LMSYS-MF benchmark definitions, Middle Filling attack
      implementations, and hyperparameters. Both target missing experimental detail for reproducibility
      but different specific items — O1 emphasizes supplementary deferral, A11 emphasizes absent
      definitions. Partial because the scope differs (paper organization vs. missing content).

  - official_id: O2
    agentic_id: A10
    match_type: partial
    issue: "Safety critic/feedback quality not validated"
    judgment_alignment: aligned
    severity_alignment: match  # official: major, agentic: moderate (gap = -1)
    rationale: >
      O2 flags that Section 4.2 names a "single, powerful LLM-based safety critic" but omits critic
      quality evaluation, making it unclear whether gains come from critic or policy learning. A10 flags
      no method for validating feedback data accuracy in the RLBF feedback loop. Both target unvalidated
      critic/feedback quality but at different levels: O2 wants accuracy metrics and component attribution;
      A10 wants a validation methodology for feedback data.

  - official_id: O4
    agentic_id: A1
    match_type: partial
    issue: "Insufficient evaluation against adaptive/strong attacks"
    judgment_alignment: aligned
    severity_alignment: match  # official: major, agentic: major (gap = 0)
    rationale: >
      O4 specifically requests adaptive attacks targeting RLBF's backtracking signal (noting GCG and
      decoding-parameter variants are included but nothing targeting the backtracking mechanism itself).
      A1 broadly flags "insufficient empirical evidence and comparative analysis." A1 is a broad umbrella
      that encompasses O4 as one instance — partial (broad-narrow pattern). Different fixes: O4 needs
      specific adaptive attack experiments; A1 needs broader evidence overall.

  - official_id: O5
    agentic_id: A4
    match_type: partial
    issue: "Efficiency and computational costs of backtracking not quantified"
    judgment_alignment: aligned
    severity_alignment: match  # official: major, agentic: moderate (gap = -1)
    rationale: >
      O5 notes the paper claims higher efficiency relative to BSAFE yet only reports ASR and utility,
      not tokens discarded or latency. A4 flags that computational demands and deployment challenges
      are undiscussed. Same issue family (efficiency/cost gap) but different scope: O5 wants specific
      efficiency comparison metrics, A4 wants deployment-oriented discussion. The paper's Limitations
      section (Sec. 7) briefly mentions computational demands but provides no data.

  - official_id: O6
    agentic_id: A1
    match_type: partial
    issue: "Missing comparisons with non-backtracking safety baselines"
    judgment_alignment: aligned
    severity_alignment: match  # official: moderate, agentic: major (gap = +1)
    rationale: >
      O6 requests contextualization with non-backtracking methods (Circuit Breakers appears in Table 2
      but not Tables 1/3). A1 broadly flags insufficient comparative analysis. A1's scope subsumes O6
      as one instance. Partial (broad-narrow): O6 needs specific baseline additions; A1 is a general
      evidence complaint.

  - official_id: O8
    agentic_id: A7
    match_type: partial
    issue: "Reward function design and effectiveness insufficiently justified"
    judgment_alignment: aligned
    severity_alignment: match  # official: moderate, agentic: moderate (gap = 0)
    rationale: >
      O8 flags that the reward function values (+1.0, -1.0, -0.5, -0.2 in Section 4.2.2) are subjective
      with no ablation to justify the specific numbers. A7 flags unclear reward function effectiveness
      and poor explanation of SFT/RL integration and critic role. Both target the reward function but
      O8 wants ablation of numerical choices; A7 wants better explanation of effectiveness and integration.

  - official_id: O11
    agentic_id: A3
    match_type: partial
    issue: "Backtracking mechanism details insufficiently explained"
    judgment_alignment: aligned
    severity_alignment: match  # official: minor, agentic: moderate (gap = +1)
    rationale: >
      O11 asks how the backtrack count (number k of tokens to remove) is represented — a specific
      clarification question about the mechanism. A3 broadly flags that the backtracking mechanism is
      insufficiently explained and needs flowcharts or worked examples. A3 is broader, encompassing
      O11's specific question as one instance. Section 4.1.1 describes the BACKTRACK_BY_X token but
      reviewers wanted more detail.

  # ============================================================
  # RELATED MATCHES (near-misses, not strict)
  # ============================================================

  - official_id: O13
    agentic_id: A3
    match_type: related
    issue: "Visual/structural explanation of method is unclear"
    judgment_alignment: n/a
    severity_alignment: n/a
    rationale: >
      O13 flags Figure 1 as confusing (doesn't clearly show BSAFE+ vs RLBF difference). A3 requests
      flowcharts or worked examples. Both concern method presentation clarity but target different
      presentation elements — a specific figure vs. the overall method description. Related, not partial,
      because they require different fixes (improve Figure 1 vs. add new explanatory material).

  - official_id: O9
    agentic_id: A11
    match_type: related
    issue: "LMSYS-MF benchmark choice/definition issues"
    judgment_alignment: n/a
    severity_alignment: n/a
    rationale: >
      O9 flags that LMSYS-MF is inconsistent with BSAFE's benchmark, questioning evaluation validity.
      A11 flags missing LMSYS-MF definitions. Both touch the LMSYS-MF benchmark but from different
      angles: consistency with prior work vs. missing definition details. Different fixes needed
      (justify benchmark choice vs. provide missing details).

# ============================================================
# POSITIVE FACTOR MATCHES (accepted paper — pro_accept drivers)
# ============================================================

positive_factor_matches:
  - official_factor_id: D1
    agentic_source: none
    match_type: none
    judgment_alignment: n/a
    rationale: >
      AC highlights well-written paper with clear motivation. The agentic system does not explicitly
      note writing quality or clear motivation as a strength in any mention or driver.

  - official_factor_id: D2
    agentic_source: mention
    agentic_text: "The backtracking mechanism is recognized as a significant contribution to enhancing LLM safety."
    match_type: partial
    judgment_alignment: aligned
    rationale: >
      M3 recognizes the backtracking mechanism as a significant contribution, capturing the core of D2
      (targeted backtracking for efficient safety correction). However, M3 does not specifically highlight
      the "removes only violating spans" efficiency aspect. The agentic system also qualifies the praise
      by noting insufficient explanation of operational details.

  - official_factor_id: D3
    agentic_source: none
    match_type: none
    judgment_alignment: n/a
    rationale: >
      AC highlights strong empirical validation across attacks and model scales (Tables 1-2 show results
      across Gemma 2 and LLaMA 3 at multiple sizes). The agentic system instead treats the empirical
      evidence as insufficient (A1 is a decisive pro_reject concern), seeing this as a weakness rather
      than a strength. This represents a significant judgment divergence.

  - official_factor_id: D4
    agentic_source: mention
    agentic_text: "RLBF is acknowledged as a novel approach to enhancing LLM safety against adversarial attacks and in-distribution errors."
    match_type: partial
    judgment_alignment: aligned
    rationale: >
      M1 mentions "in-distribution errors" alongside adversarial attacks, partially capturing D4's
      "effective beyond safety (correcting generation mistakes generally)." However, M1 does not
      emphasize the outperformance aspect or practical utility beyond safety applications.

  - official_factor_id: D8
    agentic_source: none
    match_type: none
    judgment_alignment: n/a
    rationale: >
      Post-rebuttal factor (observable_stage: rebuttal). Reviewer consensus and concern resolution
      occurred after the period the agentic system could observe. The agentic system reviewed the
      pre-rebuttal PDF and could not capture this factor.

# ============================================================
# UNMATCHED CONCERNS
# ============================================================

unmatched_official:
  - O3   # Single LLM critic adversarial vulnerability — no agentic concern about adversarial exploitability of the critic itself
  - O7   # BSAFE is arXiv preprint (not peer-reviewed) — no agentic concern about baseline publication status
  - O9   # Benchmark inconsistency with BSAFE paper — related-only edge to A11, no strict match
  - O10  # Placeholder references ([BSAFE reference]) and formatting errors — no agentic concern about formatting
  - O12  # Token count prediction accuracy under tokenization — no agentic concern about this specific technical issue
  - O13  # Figure 1 confusing — related-only edge to A3, no strict match

unmatched_agentic:
  - A2   # No error bars/statistical significance — not raised by any official reviewer
  - A5   # Code/data not available — officials raised detail-in-supplementary (O1), not artifact release
  - A6   # No theoretical results/formal backing — officials did not demand theory for this empirical paper
  - A8   # Generalization/scalability evidence — paper already tests across Gemma 2 + LLaMA 3 at multiple scales; officials did not flag this
  - A9   # Real-world prevalence data to justify need — not raised by official reviewers
  - A12  # No framework for defining "harmful" — not raised; Sec. 7 briefly acknowledges definitional difficulty
  - A13  # Mechanistic analysis needed — officials did not request deeper mechanistic explanation
  - A14  # Ethics of harmful content testing — not raised by official reviewers
  - A15  # Societal impact mitigation strategies — not raised by official reviewers
