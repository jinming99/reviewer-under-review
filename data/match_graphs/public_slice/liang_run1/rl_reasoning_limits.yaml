unmatched_agentic:
  - "A5"    # Entropy reduction confound / temperature as crude proxy — related-only to O8
  - "A6"    # Prompt sensitivity confound (base model not trained with RL prompt format)
  - "A8"    # Token-level perplexity doesn't rule out novel reasoning strategy combinations
