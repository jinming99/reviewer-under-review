  - A2   # ∆SE numerical inconsistency with Table 3 — no official flagged this
  - A4   # Overclaiming about reasoning patterns (related-only to O9)
  - A5   # CoT canceling arithmetic errors in Figure 20 — no official flagged this
  - A6   # Distillation comparison lacks controlled baseline — officials saw as strength
