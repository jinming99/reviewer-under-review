pdf_is_revised: true
revision_evidence: "OpenReview shows '3 Versions' badge (Published: 18 Sept 2025, Last Modified: 28 Oct 2025). Camera-ready includes substantial additions from rebuttal: Section 4.6 on Model Size Scaling with Magistral-Medium experiments (Figure 9, p.10), Tulu-3-70B results, and DeepSeek-R1-Zero discussion. Appendix D.4 contains perplexity evolution during training (Figure 15). Section 6 Discussion and Appendix C expanded with theoretical intuition. Tables 3-4 revised to four-category format per reviewer suggestion. Additional models (Gemma-2-2B, Mimo-7B) appear in rebuttal data. Terminology revised from 'reasoning capacity/boundary' to 'reasoning coverage/scope' per reviewer feedback."

concerns:
  # ============================================================
  # O1: Results limited to small models and low training data diversity
  # Raised by: 79qN (W1), KdU6 (Q1)
  # ============================================================
  - id: "O1"
    text: "Results are all on relatively small models (7-32B parameters) and low training data diversity (mathematical reasoning on GSM8K + MATH, coding on LeetCode and TACO); quite far from RLVR-trained frontier systems. Both model size and training data can significantly change properties of models."
    verbatim: "the results are all on relatively small models (7-32B parameters) and low training data diversity"
    raised_by: ["79qN", "KdU6"]
    severity: "major"
    resolved_in_rebuttal: true
    rebuttal_resolution: "Authors added experiments on 70B+ models: Tulu-3-70B on Math500, Magistral-Medium (close to DeepSeek-R1-671B) on AIME24/25, plus Gemma-2-2B, Mimo-7B. All show same narrowing pattern at large k, supporting the conclusion holds for frontier-level models."
    ac_treatment: "resolved"
    decisive: false
    tags: ["model_scale", "generalizability", "frontier_models", "training_diversity"]
    issue_type: "empirical"
    addressed_in_pdf: true
    pdf_evidence: "Section 4.6 (p.10) presents Model Size Scaling with Magistral-Medium on AIME24/25 (Figure 9) showing pass@k gap narrows at large k even for frontier-level models. Discussion of DeepSeek-R1-Zero, Tulu-3-70B, and resource constraints for larger models. Limitation explicitly acknowledged in Section 6."
    note: "79qN's biggest concern. Post-rebuttal, 79qN updated from Accept to Strong Accept after seeing frontier model experiments. AC specifically notes the paper 'answers this important question negatively, i.e., pass@k does not increase, even for close to frontier models.' KdU6 also raised scaling as Q1."

