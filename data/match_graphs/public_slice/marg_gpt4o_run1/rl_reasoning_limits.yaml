# Related-only edges still count as strict-unmatched (phantom concerns).
unmatched_agentic:
  - A2   # Distillation quantitative comparison (phantom -- paper already has Section 4.2)
  - A3   # Ablation parameter interplay (phantom -- no official raised this)
  - A4   # Perplexity-diversity correlation (related-only to O19)
  - A6   # Temperature/top-p justification (related-only to O8)
  - A7   # Baseline model configuration details (phantom)
  - A8   # Pretrained prior examples (related-only to O10)
