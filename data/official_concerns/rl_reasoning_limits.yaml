  # ============================================================
  # O10: Limited theoretical insight for why RLVR fails to expand reasoning
  # Raised by: tKuY (W1)
  # ============================================================
  - id: "O10"
    text: "Lacks explanation for why RLVR fails to expand reasoning boundaries. Paper includes some intuitive descriptions about base models' boundaries but they remain informal."
    verbatim: "Lacks explanation for why RLVR fails to expand reasoning boundaries"
    raised_by: ["tKuY"]
    severity: "major"
    resolved_in_rebuttal: true
    rebuttal_resolution: "Authors provided explanation in Appendix C: RLVR methods are on-policy and rely on pretrained prior in vast action space, making exploration of out-of-prior trajectories exceedingly rare. Cited concurrent theoretical work formalizing this intuition (The Invisible Leash, 2025)."
    ac_treatment: "not_mentioned"
    decisive: false
    tags: ["theoretical_explanation", "exploration_limitation", "on_policy"]
    issue_type: "conceptual"
    addressed_in_pdf: true
    pdf_evidence: "Appendix C Discussion (p.17) provides two key discussions: 'Key Differences Between Traditional RL and RLVR for LLMs are Vast Action Space and Pretrained Priors' and 'Priors as a Double-Edged Sword in This Vast Action Space.' Explains on-policy sampling, vast action space (V^L ~ 150000^4096), and pretrained prior constraining exploration."
    note: "tKuY's post-rebuttal: 'my concerns have already been addressed and I have no further questions. I will keep my positive score.' The theoretical intuition in Appendix C is substantive but remains informal rather than formal."

